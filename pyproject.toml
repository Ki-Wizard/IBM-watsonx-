[project]
name = "gamak-red-tide-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx2[http2,brotli,zstd]>=2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.55,<2",
    "typer>=0.16,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
